<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Download limit reached favicon">
  <defs>
    <linearGradient id="limitBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2110" />
      <stop offset="1" stop-color="#120c06" />
    </linearGradient>
    <linearGradient id="limitPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24190d" />
